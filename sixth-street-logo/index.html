<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sixth Street — Logo Construction Loop</title>
<style>
  :root{ --bg:#000; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; width:100%; background:var(--bg); overflow:hidden; cursor:none; }
  .stage{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  svg#scene{ width:min(90vw,1500px); height:auto; overflow:visible; display:block; }
  .grain{ position:absolute; inset:0; pointer-events:none; opacity:.035; mix-blend-mode:overlay; }
  .caption{
    position:absolute; bottom:28px; right:32px;
    font:11px/1 "SF Mono", ui-monospace, Menlo, monospace;
    letter-spacing:.14em; color:rgba(255,255,255,.28); text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="-40 -25 700 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".6"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#fff" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="wordmarkClip"><rect id="wordmarkClipRect" x="150" y="20" width="480" height="120"/></clipPath>
      <clipPath id="taglineClip"><rect id="taglineClipRect" x="150" y="128" width="300" height="30"/></clipPath>
    </defs>

    <rect x="-40" y="-25" width="700" height="200" fill="#000"/>

    <!-- camera: pans/zooms from a tight hero framing on the mark out to the full lockup -->
    <g id="camera">
      <ellipse id="glowEl" cx="62" cy="70" rx="95" ry="95" fill="url(#glow)" opacity="0"/>

      <g id="grid" stroke="#fff" fill="none" opacity="0">
        <g stroke-opacity=".18" stroke-width=".6">
          <line x1="-30" y1="84" x2="150" y2="84"/>
          <line x1="15" y1="31" x2="110" y2="31"/>
          <line x1="15" y1="133" x2="110" y2="133"/>
          <line x1="43" y1="-20" x2="43" y2="150"/>
          <line x1="81" y1="-20" x2="81" y2="150"/>
          <line x1="62" y1="-20" x2="62" y2="150"/>
        </g>
        <g stroke-opacity=".12" stroke-width=".6">
          <line x1="43" y1="31" x2="82" y2="133"/>
          <line x1="81" y1="31" x2="41" y2="133"/>
          <line x1="69" y1="-15" x2="69" y2="20"/>
          <line x1="96" y1="-15" x2="96" y2="20"/>
        </g>
        <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="4.4" letter-spacing=".5" fill="#fff" fill-opacity=".4" stroke="none">
          <text x="17" y="28">.5x</text>
          <text x="17" y="130">.3x</text>
          <text x="-28" y="81">x</text>
        </g>
      </g>

      <!-- solid mark silhouette (exact vector) -->
      <path id="outerMark" fill="#fff" fill-opacity="0"
        d="M122.99,80.74l-38.42-51.42.26-.36h0s15.43-20.92,15.43-20.92c1.14-1.54,1.31-3.56.44-5.27C99.82,1.06,98.1,0,96.18,0h-.02l-26.79.08c-5.42.02-10.58,2.64-13.81,7L.99,81.13c-1.33,1.79-1.31,4.27.02,6.01l34.73,46.47c3.25,4.33,8.4,6.91,13.8,6.91h.05l25.17-.08c5.42-.02,10.58-2.64,13.81-7l34.43-46.69c1.33-1.79,1.32-4.27-.02-6.01Z"/>

      <!-- the 7 facets: each "cuts" out of the solid mark in sequence, revealing the true faceted geometry -->
      <g id="cuts" fill="#000">
        <polygon class="cut" data-cx="87.05" data-cy="63.1" points="118.6,81.5 83.1,81.6 64.4,56.7 82.1,32.7"/>
        <polygon class="cut" data-cx="61.95" data-cy="84.05" points="62.1,107.9 44.2,84.0 61.7,60.4 79.8,83.9"/>
        <polygon class="cut" data-cx="36.82" data-cy="63.32" points="40.9,81.8 5.4,81.9 41.6,32.9 59.4,56.7"/>
        <polygon class="cut" data-cx="68.32" data-cy="21.63" points="58.8,9.5 69.4,4.1 96.2,4.0 79.6,29.3 61.9,53.4 44.0,29.5"/>
        <polygon class="cut" data-cx="37.3" data-cy="109.72" points="38.9,131.2 5.1,85.9 40.6,85.8 59.6,111.3 42.3,134.4"/>
        <polygon class="cut" data-cx="62.06" data-cy="131.94" points="74.8,136.4 49.6,136.5 46.1,136.1 62.1,114.6 77.7,136.1"/>
        <polygon class="cut" data-cx="86.74" data-cy="109.58" points="85.3,131.1 81.5,134.5 64.6,111.2 83.4,85.6 118.9,85.5"/>
      </g>
    </g>

    <!-- wordmark: exact vector, revealed with a clip-wipe once the camera settles -->
    <g id="wordmarkClipped" clip-path="url(#wordmarkClip)">
      <path id="wordmarkPath" fill="#fff" transform="translate(0,0)"
        d="M183.5,49.23c5.15,0,9.76,1.16,13.81,3.48,4.05,2.32,6.77,5.37,8.15,9.14l-4.71,5.65-.76-.09c-.94-4.21-2.88-7.52-5.8-9.93-2.92-2.42-6.49-3.63-10.7-3.63-4.46,0-8.05,1.05-10.74,3.16-2.71,2.1-4.05,4.91-4.05,8.42,0,2.95.94,5.34,2.83,7.16s4.71,3.29,8.48,4.42l10.84,3.39c5.28,1.63,9.32,4,12.11,7.11,2.8,3.11,4.2,7.15,4.2,12.1,0,3.83-.99,7.2-2.97,10.12-1.98,2.92-4.76,5.19-8.34,6.83-3.58,1.63-7.63,2.44-12.16,2.44-5.78,0-10.97-1.43-15.55-4.29h-.03c-4.58-2.86-7.57-6.55-8.95-11.06l5.18-5.74.76.09c.82,4.96,2.96,8.93,6.41,11.91,3.45,2.99,7.54,4.48,12.26,4.48s8.75-1.22,11.74-3.68c2.99-2.44,4.48-5.71,4.48-9.79,0-3.52-.99-6.37-2.97-8.57-1.98-2.19-4.91-3.89-8.82-5.09l-10.56-3.2c-5.15-1.63-9.08-3.83-11.78-6.59-2.71-2.76-4.05-6.34-4.05-10.73,0-3.52.93-6.59,2.79-9.23,1.86-2.63,4.41-4.68,7.69-6.12,3.27-1.45,7.01-2.17,11.22-2.17ZM291.89,69.2l13.01-.57.28,4.9h-13.29v33.14c0,2.63.62,4.57,1.88,5.79,1.26,1.22,2.92,1.83,4.99,1.83,2.39,0,4.25-.5,5.56-1.5l.37,3.48c-.76.76-1.79,1.4-3.11,1.93-1.32.53-2.8.8-4.43.8-3.64,0-6.55-1.05-8.72-3.15h.01c-2.17-2.1-3.25-5.26-3.25-9.47v-32.86h-9.15v-3.48c2.89-.19,5.14-.62,6.74-1.32,1.61-.69,2.83-1.89,3.68-3.57.85-1.7,1.39-4.17,1.65-7.44h3.77v11.49ZM512.62,67.79c5.03,0,9.16,1.14,12.4,3.44,3.24,2.3,5.52,5.27,6.88,8.94,1.35,3.68,1.9,7.58,1.65,11.73h-36.38v.66c0,4.14.76,7.77,2.26,10.88,1.51,3.11,3.58,5.5,6.23,7.16,2.64,1.66,5.56,2.5,8.76,2.5,7.73,0,12.97-3.98,15.75-11.96l3.86,1.22c-1.26,4.96-3.72,8.9-7.4,11.82-3.68,2.92-8.15,4.38-13.44,4.38-4.53,0-8.57-1.1-12.11-3.29-3.56-2.19-6.31-5.22-8.25-9.09-1.95-3.86-2.92-8.21-2.92-13.04s.94-9.09,2.83-12.95c1.89-3.86,4.54-6.89,7.97-9.09,3.43-2.19,7.4-3.29,11.92-3.29ZM562.61,67.79c5.03,0,9.16,1.14,12.39,3.44,3.24,2.3,5.53,5.27,6.88,8.94,1.35,3.68,1.9,7.58,1.65,11.73h-36.38v.66c0,4.14.76,7.77,2.26,10.88,1.5,3.11,3.58,5.5,6.23,7.16,2.64,1.66,5.56,2.5,8.76,2.5,7.73,0,12.97-3.98,15.75-11.96l3.86,1.22c-1.26,4.96-3.72,8.9-7.4,11.82-3.68,2.92-8.15,4.38-13.44,4.38-4.53,0-8.57-1.1-12.11-3.29-3.55-2.19-6.3-5.22-8.25-9.09-1.95-3. .09-1.79v30.42ZM223.55,113.08l3.29,4.24v.76h-13.29v-.76l3.29-4.24v-37.29l-3.29-4.61v-.66l10-1.79v44.35ZM245.89,69.95l-1.42,4.33,8.95,13.56,9.15-13.56-1.32-4.33.09-.76h12.83v.76l-5.47,4.52-12.63,17.32,14.05,21.28,5.28,4.24v.76h-14.23l-.19-.76,1.32-4.14-10.28-15.54-10.37,15.54,1.32,4.14-.09.76h-12.83v-.76l5.47-4.24,13.95-19.39-12.72-19.21-5.18-4.52v-.76h14.14l.19.76ZM485.6,67.79c1.38,0,2.48.12,3.29.37l-.57,6.97c-1.38-.37-2.67-.56-3.86-.56-3.4,0-6.11,1.3-8.15,3.91-2.05,2.6-3.44,5.63-4.2,9.09v25.05l4.34,4.24v.76h-14.33v-.77l3.29-4.24v-37.29l-3.29-4.61v-.66l10-1.79v10.92c1.32-3.57,3.13-6.37,5.42-8.38,2.3-2.01,4.98-3.01,8.06-3.01ZM512.62,71.84c-4.02,0-7.37,1.5-10.04,4.52-2.67,3.01-4.35,6.88-5.05,11.58h28.76c-.19-4.58-1.51-8.41-3.96-11.49-2.46-3.08-5.69-4.61-9.71-4.61ZM562.61,71.84c-4.02,0-7.37,1.5-10.04,4.52-2.67,3.01-4.35,6.88-5.05,11.58h28.76c-.19-4.58-1.51-8.41-3.96-11.49-2.46-3.08-5.69-4.61-9.71-4.61ZM219.96,50.75c1.38,0,2.65.48,3.63,1.41.97.94,1.46,2.1,1.46,3.48s-.49,2.54-1.46,3.48c-.97.94-2.19,1.41-3.63,1.41s-2.54-.48-3.44-1.41c-.92-.94-1.37-2.1-1.37-3.48s.45-2.54,1.37-3.48c.91-.94,2.06-1.41,3.44-1.41Z"
        style="transform-box:fill-box"/>
      <rect id="sheenRect" x="-40" y="30" width="40" height="100" fill="url(#sheen)"/>
    </g>

    <g clip-path="url(#taglineClip)">
      <text id="tagline" x="151" y="150" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing=".5" fill="#fff" fill-opacity=".7">Specialty Lending</text>
    </g>
  </svg>

  <svg class="grain" width="100%" height="100%">
    <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>
  <div class="caption">Sixth Street — Construction Loop</div>
</div>

<script>
(function(){
  const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const EASE_INOUT = 'cubic-bezier(0.65, 0, 0.35, 1)';
  const EASE_POP = 'cubic-bezier(0.34, 1.56, 0.64, 1)';

  const camera = document.getElementById('camera');
  const grid = document.getElementById('grid');
  const glow = document.getElementById('glowEl');
  const outer = document.getElementById('outerMark');
  const cuts = Array.from(document.querySelectorAll('.cut'));
  const wordmarkClipRect = document.getElementById('wordmarkClipRect');
  const taglineClipRect = document.getElementById('taglineClipRect');
  const sheenRect = document.getElementById('sheenRect');
  const wordmarkPath = document.getElementById('wordmarkPath');
  const stage = document.querySelector('.stage');

  const HERO = 'translate(310px,75px) scale(2.6) translate(-62px,-70.3px)';
  const FINAL = 'translate(0px,0px) scale(1) translate(0px,0px)';

  cuts.forEach(c => {
    c.style.transformBox = 'fill-box';
    c.style.transformOrigin = 'center';
  });
  wordmarkClipRect.style.transformOrigin = '150px 0px';
  taglineClipRect.style.transformOrigin = '150px 0px';

  const wordmarkW = wordmarkPath.getBBox().width + 20;
  const taglineW = document.getElementById('tagline').getBBox().width + 16;
  const sheenTravel = wordmarkW + 160;

  function resetState(){
    document.getAnimations().forEach(a => a.cancel());
    camera.style.transform = HERO;
    grid.style.opacity = 0;
    glow.style.opacity = 0;
    outer.style.fillOpacity = 0;
    cuts.forEach(c => c.style.transform = 'scale(0)');
    wordmarkClipRect.style.transform = 'scaleX(0)';
    taglineClipRect.style.transform = 'scaleX(0)';
    sheenRect.style.transform = 'translateX(0px)';
    sheenRect.style.opacity = 0;
    stage.style.opacity = 1;
  }

  function anim(el, kf, opts){
    return el.animate(kf, Object.assign({ fill:'forwards', easing:EASE }, opts));
  }

  // cut order: flap -> upper-left/upper-right -> center -> lower-left/lower-right -> bottom tip
  const cutOrder = [3, 2, 0, 1, 4, 6, 5];
  const cutTimes  = [0, 170, 210, 470, 690, 730, 980];
  const cutDur = 380;

  function playLoop(){
    resetState();

    anim(grid, [{opacity:0},{opacity:1}], {duration:520, delay:80});
    anim(outer, [{fillOpacity:0},{fillOpacity:1}], {duration:420, delay:160, easing:EASE_INOUT});

    const buildStart = 620;
    let lastCutEnd = 0;
    cutOrder.forEach((idx, i) => {
      const el = cuts[idx];
      const start = buildStart + cutTimes[i];
      anim(el, [{ transform:'scale(0)' },{ transform:'scale(1)' }], { duration: cutDur, delay: start, easing: EASE_POP });
      lastCutEnd = Math.max(lastCutEnd, start + cutDur);
    });

    anim(glow, [{opacity:0},{opacity:.55},{opacity:0}], { duration:850, delay: lastCutEnd - 80, easing: EASE_INOUT });
    camera.style.transformOrigin = '0px 0px';
    anim(camera, [{ transform: HERO },{ transform: HERO }], { duration: lastCutEnd + 300 });

    const gridOutStart = lastCutEnd + 220;
    anim(grid, [{opacity:1},{opacity:0}], { duration:480, delay: gridOutStart });

    // camera pulls back + pans from the hero framing to the full lockup
    const panStart = gridOutStart + 120;
    const panDur = 1650;
    anim(camera, [{ transform: HERO },{ transform: FINAL }], { duration: panDur, delay: panStart, easing: EASE_INOUT });

    const wordStart = panStart + panDur - 260;
    anim(wordmarkClipRect, [{ transform:'scaleX(0)' },{ transform:'scaleX(1)' }], { duration:620, delay: wordStart });

    const tagStart = wordStart + 320;
    anim(taglineClipRect, [{ transform:'scaleX(0)' },{ transform:'scaleX(1)' }], { duration:520, delay: tagStart });

    const sheenStart = tagStart + 380;
    anim(sheenRect, [
      { transform:'translateX(0px)', opacity:0 },
      { transform:'translateX(' + (sheenTravel*0.15) + 'px)', opacity:.85 },
      { transform:'translateX(' + sheenTravel + 'px)', opacity:0 }
    ], { duration:700, delay: sheenStart, easing: EASE_INOUT });

    const fadeStart = sheenStart + 900;
    anim(stage, [{opacity:1},{opacity:1},{opacity:0}], { duration:600, delay: fadeStart, easing: EASE_INOUT });

    const total = fadeStart + 600 + 360;
    setTimeout(playLoop, total);
  }

  resetState();
  playLoop();
})();
</script>
</body>
</html>
